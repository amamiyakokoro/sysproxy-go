name: Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release, e.g. v1.0.0"
        required: true
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - master
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
        go-version: '1.26'

    - name: Test library and compatibility interfaces
      run: go test ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs:
          - { goos: darwin, goarch: arm64, output: arm64 }
          - { goos: darwin, goarch: amd64, goamd64: v3, output: amd64-v3 }

          - { goos: linux, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: linux, goarch: arm64, output: arm64 }

          - { goos: windows, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: windows, goarch: arm64, output: arm64 }

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
        go-version: '1.26'

    - name: Build
      env:
        GOOS: ${{matrix.jobs.goos}}
        GOARCH: ${{matrix.jobs.goarch}}
        GOAMD64: ${{matrix.jobs.goamd64}}
        CGO_ENABLED: 0
      run: |
        go env
        if [ "${{ matrix.jobs.goos }}" == "windows" ]; then
          go build -ldflags "-extldflags --static -w -s -buildid=" -o sysproxy-${{matrix.jobs.goos}}-${{matrix.jobs.output}}.exe
        else
          go build -ldflags "-extldflags --static -w -s -buildid=" -o sysproxy-${{matrix.jobs.goos}}-${{matrix.jobs.output}}
        fi

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: "${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
        path: |
          sysproxy-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}*

  pre-release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: bin/
        merge-multiple: true

    - name: Delete current release assets
      uses: 8Mi-Tech/delete-release-assets-action@main
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag: pre-release
        deleteOnlyFromDrafts: false

    - name: Tag Repo
      uses: richardsimko/update-tag@v1
      with:
        tag_name: pre-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Prerelease
      uses: softprops/action-gh-release@v3
      if: ${{  success() }}
      with:
        tag_name: pre-release
        files: |
          bin/*
        prerelease: true

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    needs: [build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Delete Current
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.RELEASE_TAG }}
          deleteOnlyFromDrafts: false

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            bin/*
